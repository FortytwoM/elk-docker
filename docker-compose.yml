services:

  tls:
    build:
      context: tls/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    user: root
    init: true
    volumes:
      - ./tls/entrypoint.sh:/entrypoint.sh:ro,Z
      - ./tls/instances.yml:/usr/share/elasticsearch/tls/instances.yml:ro,Z
      - ./tls/certs:/usr/share/elasticsearch/tls/certs:z
    environment:
      FLEET_EXTERNAL_HOST: ${FLEET_EXTERNAL_HOST:-}
    restart: "no"

  kibana-init:
    build:
      context: kibana/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    user: root
    volumes:
      - ./kibana/init-keys.sh:/usr/share/kibana/init-keys.sh:ro,Z
      - ./kibana/config/kibana.yml:/kibana-template/kibana.yml:ro,Z
      - kibana-config:/kibana-config
      - ./tls/certs/ca/ca.crt:/usr/share/kibana/ca.crt:ro,Z
    environment:
      KIBANA_TEMPLATE: /kibana-template/kibana.yml
      KIBANA_CONFIG: /kibana-config/kibana.yml
      CA_CERT_PATH: /usr/share/kibana/ca.crt
      FLEET_EXTERNAL_HOST: ${FLEET_EXTERNAL_HOST:-}
      KIBANA_PORT: ${KIBANA_PORT:-5601}
      ES_PORT: ${ES_PORT:-9200}
      FLEET_PORT: ${FLEET_PORT:-8220}
      ARTIFACTS_PORT: ${ARTIFACTS_PORT:-9080}
    command: ["/bin/sh", "-c", "sed 's/\\r//' /usr/share/kibana/init-keys.sh > /tmp/init-keys.sh && /bin/sh /tmp/init-keys.sh"]
    depends_on:
      tls:
        condition: service_completed_successfully
    restart: "no"

  setup:
    build:
      context: setup/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    init: true
    volumes:
      - ./setup/entrypoint.sh:/entrypoint.sh:ro,Z
      - ./setup/lib.sh:/lib.sh:ro,Z
      - ./setup/roles:/roles:ro,Z
      - ./tls/certs/ca/ca.crt:/ca.crt:ro,z
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      LOGSTASH_INTERNAL_PASSWORD: ${LOGSTASH_INTERNAL_PASSWORD:-}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-}
      METRICBEAT_INTERNAL_PASSWORD: ${METRICBEAT_INTERNAL_PASSWORD:-}
      FILEBEAT_INTERNAL_PASSWORD: ${FILEBEAT_INTERNAL_PASSWORD:-}
      HEARTBEAT_INTERNAL_PASSWORD: ${HEARTBEAT_INTERNAL_PASSWORD:-}
      MONITORING_INTERNAL_PASSWORD: ${MONITORING_INTERNAL_PASSWORD:-}
      BEATS_SYSTEM_PASSWORD: ${BEATS_SYSTEM_PASSWORD:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    network_mode: service:elasticsearch
    depends_on:
      kibana-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    restart: "no"

  elasticsearch:
    build:
      context: elasticsearch/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    depends_on:
      tls:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -s --cacert /usr/share/elasticsearch/config/ca.crt
          -u elastic:$${ELASTIC_PASSWORD}
          https://localhost:9200/_cluster/health?local=true
          | grep -qE '"status"\s*:\s*"(green|yellow)"'
          || exit 1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    volumes:
      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro,Z
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./tls/certs/ca/ca.crt:/usr/share/elasticsearch/config/ca.crt:ro,z
      - ./tls/certs/elasticsearch/elasticsearch.crt:/usr/share/elasticsearch/config/elasticsearch.crt:ro,z
      - ./tls/certs/elasticsearch/elasticsearch.key:/usr/share/elasticsearch/config/elasticsearch.key:ro,z
    ports:
      # Agents ship data directly to ES (Fleet Server is control plane only).
      # Local-only: ES_PORT=127.0.0.1:9200. Transport 9300 is not published (single-node).
      - ${ES_PORT:-9200}:9200
    environment:
      node.name: elasticsearch
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms2g -Xmx2g}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      xpack.ml.use_auto_machine_memory_percent: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: ${ES_MEM_LIMIT:-6g}
    networks:
      - elk
    restart: unless-stopped

  logstash:
    build:
      context: logstash/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro,Z
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro,Z
      - ./tls/certs/ca/ca.crt:/usr/share/logstash/config/ca.crt:ro,z
      - ./tls/certs/logstash:/usr/share/logstash/config/logstash-tls:ro,z
    ports:
      - ${LOGSTASH_BEATS_PORT:-5044}:5044
      - ${LOGSTASH_TCP_PORT:-50000}:50000/tcp
      - ${LOGSTASH_TCP_PORT:-50000}:50000/udp
      - 127.0.0.1:9600:9600
    environment:
      LS_JAVA_OPTS: ${LS_JAVA_OPTS:--Xms256m -Xmx256m}
      LOGSTASH_INTERNAL_PASSWORD: ${LOGSTASH_INTERNAL_PASSWORD:-}
    networks:
      - elk
    depends_on:
      setup:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    mem_limit: ${LS_MEM_LIMIT:-768m}
    restart: unless-stopped

  kibana:
    build:
      context: kibana/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -s --cacert /usr/share/kibana/config/ca.crt
          https://localhost:5601/api/status
          | grep -qE '"level"\s*:\s*"(available|degraded)"'
          || exit 1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s
    command:
      - /bin/sh
      - -c
      - >-
        cp /kibana-generated/kibana.yml /usr/share/kibana/config/kibana.yml
        && /usr/local/bin/kibana-docker
    volumes:
      - kibana-config:/kibana-generated:ro
      - ./tls/certs/ca/ca.crt:/usr/share/kibana/config/ca.crt:ro,z
      - ./tls/certs/kibana/kibana.crt:/usr/share/kibana/config/kibana.crt:ro,Z
      - ./tls/certs/kibana/kibana.key:/usr/share/kibana/config/kibana.key:ro,Z
    ports:
      - ${KIBANA_PORT:-5601}:5601
    environment:
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-}
    networks:
      - elk
    depends_on:
      kibana-init:
        condition: service_completed_successfully
      setup:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      package-registry:
        condition: service_healthy
    mem_limit: ${KIBANA_MEM_LIMIT:-2g}
    restart: unless-stopped

  defend-init:
    build:
      context: kibana/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    user: root
    volumes:
      - ./kibana/patch-defend-artifacts.sh:/usr/share/kibana/patch-defend-artifacts.sh:ro,Z
      - ./tls/certs/ca/ca.crt:/usr/share/kibana/config/ca.crt:ro,Z
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      FLEET_EXTERNAL_HOST: ${FLEET_EXTERNAL_HOST:-}
      ARTIFACTS_PORT: ${ARTIFACTS_PORT:-9080}
      CA_CERT_PATH: /usr/share/kibana/config/ca.crt
      KIBANA_URL: https://kibana:5601
    command:
      - /bin/sh
      - -c
      - sed 's/\r//' /usr/share/kibana/patch-defend-artifacts.sh > /tmp/patch.sh && /bin/sh /tmp/patch.sh
    depends_on:
      kibana:
        condition: service_healthy
      package-registry:
        condition: service_healthy
    networks:
      - elk
    restart: "no"

  package-registry:
    image: docker.elastic.co/package-registry/distribution:lite-${ELASTIC_VERSION:-9.5.3}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      # Cap Go heap before the cgroup kills the process (full distribution image OOMs at 2g).
      GOMEMLIMIT: ${REGISTRY_GOMEMLIMIT:-768MiB}
    networks:
      - elk
    mem_limit: ${REGISTRY_MEM_LIMIT:-1g}
    restart: unless-stopped

  endpoint-artifacts:
    image: nginx:alpine
    command:
      - /bin/sh
      - -c
      - mkdir -p /var/cache/nginx/elastic && chown -R nginx:nginx /var/cache/nginx/elastic && nginx -g 'daemon off;'
    volumes:
      - ./extensions/endpoint-artifacts/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./tls/certs/ca/ca.crt:/etc/nginx/ca.crt:ro,z
      - artifacts-cache:/var/cache/nginx/elastic
    ports:
      - ${ARTIFACTS_PORT:-9080}:80
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: ${ARTIFACTS_MEM_LIMIT:-128m}
    networks:
      - elk
    restart: unless-stopped

  fleet-server:
    build:
      context: extensions/fleet/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    user: root
    entrypoint: ["/usr/local/bin/install-ca.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --cacert /usr/share/elastic-agent/ca.crt https://localhost:8220/api/status | grep -q HEALTHY || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    volumes:
      - fleet-server-state:/usr/share/elastic-agent/state
      - ./tls/certs/ca/ca.crt:/usr/share/elastic-agent/ca.crt:ro,z
      - ./tls/certs/fleet-server/fleet-server.crt:/usr/share/elastic-agent/fleet-server.crt:ro,Z
      - ./tls/certs/fleet-server/fleet-server.key:/usr/share/elastic-agent/fleet-server.key:ro,Z
    environment:
      FLEET_SERVER_ENABLE: '1'
      FLEET_SERVER_HOST: 0.0.0.0
      FLEET_SERVER_POLICY_ID: fleet-server-policy
      FLEET_URL: https://fleet-server:8220
      FLEET_SERVER_CERT: /usr/share/elastic-agent/fleet-server.crt
      FLEET_SERVER_CERT_KEY: /usr/share/elastic-agent/fleet-server.key
      KIBANA_HOST: https://kibana:5601
      ELASTICSEARCH_HOST: https://elasticsearch:9200
      FLEET_SERVER_ELASTICSEARCH_HOST: https://elasticsearch:9200
      ELASTICSEARCH_CA: /usr/share/elastic-agent/ca.crt
      KIBANA_FLEET_SETUP: '1'
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-}
    ports:
      - ${FLEET_PORT:-8220}:8220
    hostname: fleet-server
    restart: unless-stopped
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
      package-registry:
        condition: service_healthy
      defend-init:
        condition: service_completed_successfully
    mem_limit: ${FLEET_MEM_LIMIT:-1g}

  # --- Extensions (activate with --profile) ---

  metricbeat:
    profiles: [monitoring]
    build:
      context: extensions/metricbeat/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    user: root
    cap_add:
      - SYS_PTRACE
    command:
      - -e
      - --strict.perms=false
      - --system.hostfs=/hostfs
    volumes:
      - ./extensions/metricbeat/config/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro,Z
      - /proc:/hostfs/proc:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./tls/certs/ca/ca.crt:/usr/share/metricbeat/ca.crt:ro,z
    environment:
      METRICBEAT_INTERNAL_PASSWORD: ${METRICBEAT_INTERNAL_PASSWORD:-}
      MONITORING_INTERNAL_PASSWORD: ${MONITORING_INTERNAL_PASSWORD:-}
      BEATS_SYSTEM_PASSWORD: ${BEATS_SYSTEM_PASSWORD:-}
    cgroup: host
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    profiles: [monitoring]
    build:
      context: extensions/filebeat/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    user: root
    command:
      - -e
      - --strict.perms=false
    volumes:
      - ./extensions/filebeat/config/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro,Z
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./tls/certs/ca/ca.crt:/usr/share/filebeat/ca.crt:ro,z
    environment:
      FILEBEAT_INTERNAL_PASSWORD: ${FILEBEAT_INTERNAL_PASSWORD:-}
      BEATS_SYSTEM_PASSWORD: ${BEATS_SYSTEM_PASSWORD:-}
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy

  heartbeat:
    profiles: [monitoring]
    build:
      context: extensions/heartbeat/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    command:
      - -e
      - --strict.perms=false
    volumes:
      - ./extensions/heartbeat/config/heartbeat.yml:/usr/share/heartbeat/heartbeat.yml:ro,Z
      - ./tls/certs/ca/ca.crt:/usr/share/heartbeat/ca.crt:ro,z
    environment:
      HEARTBEAT_INTERNAL_PASSWORD: ${HEARTBEAT_INTERNAL_PASSWORD:-}
      BEATS_SYSTEM_PASSWORD: ${BEATS_SYSTEM_PASSWORD:-}
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  elasticsearch-data:
  kibana-config:
  fleet-server-state:
  artifacts-cache:

networks:
  elk:
    driver: bridge
