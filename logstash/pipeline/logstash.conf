input {
	beats {
		port => 5044
		ssl_enabled => true
		ssl_certificate => "/usr/share/logstash/config/logstash-tls/logstash.crt"
		ssl_key => "/usr/share/logstash/config/logstash-tls/logstash.pkcs8.key"
		ssl_client_authentication => "none"
	}

	tcp {
		port => 50000
		codec => json_lines
	}

	udp {
		port => 50000
		codec => json_lines
	}
}

output {
	elasticsearch {
		hosts => "https://elasticsearch:9200"
		user => "logstash_internal"
		password => "${LOGSTASH_INTERNAL_PASSWORD}"
		ssl_enabled => true
		ssl_certificate_authorities => "config/ca.crt"
		data_stream => true
		data_stream_type => "logs"
		data_stream_dataset => "generic"
		data_stream_namespace => "default"
		ecs_compatibility => "v8"
	}
}
