# Local Elastic artifact mirror.
#   /downloads/endpoint/  → Defend malware models (artifacts.security.elastic.co)
#   /downloads/           → Agent / Beats binaries (artifacts.elastic.co), disk-cached
#
# This is NOT a Fleet Settings "Proxy" (corporate HTTP proxy). Agents talk to this
# host directly. Docker host needs outbound HTTPS; enrolled endpoints do not.
# ETag must be forwarded on Defend paths — Endpoint uses it to detect updates.
# Ref. https://www.elastic.co/docs/reference/fleet/air-gapped

proxy_cache_path /var/cache/nginx/elastic
  levels=1:2
  keys_zone=elastic:32m
  max_size=8g
  inactive=90d;

log_format cache '$remote_addr $request $status cache=$upstream_cache_status';

server {
  listen 80;
  server_name _;
  access_log /var/log/nginx/access.log cache;

  resolver 127.0.0.11 ipv6=off valid=30s;

  location /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /ca.crt {
    alias /etc/nginx/ca.crt;
    default_type application/x-x509-ca-cert;
    add_header Content-Disposition 'attachment; filename="ca.crt"';
  }

  # Elastic Defend protection artifacts (malware model, blocklists).
  location /downloads/endpoint/ {
    set $defend_up https://artifacts.security.elastic.co;
    proxy_pass $defend_up;
    proxy_ssl_server_name on;
    proxy_ssl_name artifacts.security.elastic.co;
    proxy_set_header Host artifacts.security.elastic.co;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 15s;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }

  location = /GPG-KEY-elastic-agent {
    set $elastic_up https://artifacts.elastic.co;
    proxy_pass $elastic_up;
    proxy_ssl_server_name on;
    proxy_ssl_name artifacts.elastic.co;
    proxy_set_header Host artifacts.elastic.co;
    proxy_http_version 1.1;
    proxy_cache elastic;
    proxy_cache_valid 200 90d;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
  }

  # Elastic Agent / Beats / endpoint-security binaries (upgrades).
  location /downloads/ {
    set $elastic_up https://artifacts.elastic.co;
    proxy_pass $elastic_up;
    proxy_ssl_server_name on;
    proxy_ssl_name artifacts.elastic.co;
    proxy_set_header Host artifacts.elastic.co;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 15s;
    proxy_read_timeout 600s;
    proxy_buffering on;
    proxy_request_buffering off;
    proxy_max_temp_file_size 2048m;
    proxy_cache elastic;
    proxy_cache_valid 200 90d;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    add_header X-Artifact-Cache $upstream_cache_status always;
  }
}
